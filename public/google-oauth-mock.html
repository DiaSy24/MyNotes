<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google ile oturum açın</title>
  <style>
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #fff;
      color: #202124;
    }
    .container {
      width: 448px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 48px 40px 36px;
      box-sizing: border-box;
      text-align: center;
    }
    .logo {
      width: 75px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 400;
      margin: 0 0 10px;
    }
    p {
      font-size: 16px;
      margin: 0 0 32px;
      color: #202124;
    }
    .account-list {
      text-align: left;
      border-top: 1px solid #dadce0;
      margin-bottom: 24px;
    }
    .account-item {
      display: flex;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #dadce0;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .account-item:hover {
      background-color: #f8f9fa;
    }
    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      margin-right: 12px;
    }
    .account-info {
      flex: 1;
    }
    .name {
      font-size: 14px;
      font-weight: 500;
      color: #3c4043;
    }
    .email {
      font-size: 12px;
      color: #5f6368;
    }
  </style>
</head>
<body>
  <div class="container">
    <svg class="logo" viewBox="0 0 74 24" xmlns="http://www.w3.org/2000/svg"><path d="M9.4 18.6c-5.4 0-9.4-4-9.4-9.3s4-9.3 9.4-9.3c2.9 0 5 1.1 6.6 2.6l-1.9 1.8c-1.1-1-2.6-1.8-4.7-1.8-3.9 0-7 3.2-7 7.2s3.1 7.2 7 7.2c2.4 0 3.8-1 4.7-1.9.8-.8 1.3-1.9 1.4-3.4H9.4v-2.5h8.6c.1.4.1 1 .1 1.5 0 1.8-.5 4.1-1.9 5.7-1.4 1.7-3.2 2.7-5.8 2.7z" fill="#4285f4"></path><path d="M21 18.6c-3.1 0-5.5-2.3-5.5-5.5s2.3-5.5 5.5-5.5 5.5 2.3 5.5 5.5-2.3 5.5-5.5 5.5zm0-8.6c-1.8 0-3.3 1.4-3.3 3.1s1.5 3.1 3.3 3.1 3.3-1.4 3.3-3.1-1.5-3.1-3.3-3.1z" fill="#ea4335"></path><path d="M32.8 18.6c-3.1 0-5.5-2.3-5.5-5.5s2.3-5.5 5.5-5.5 5.5 2.3 5.5 5.5-2.3 5.5-5.5 5.5zm0-8.6c-1.8 0-3.3 1.4-3.3 3.1s1.5 3.1 3.3 3.1 3.3-1.4 3.3-3.1-1.5-3.1-3.3-3.1z" fill="#fbbc05"></path><path d="M44.4 18.6c-2.9 0-5.3-2.3-5.3-5.5s2.3-5.5 5.1-5.5c2.6 0 4.2 1.6 4.9 2.5l-2 1.3c-.5-.7-1.3-1.4-2.8-1.4-1.7 0-3 1.5-3 3.1s1.3 3.1 3 3.1c1.3 0 2.2-.6 2.6-1.1v-2.3h-2.6v-2.4h5v7.8h-2.2v-1.6h-.1c-.7 1.1-2 1.8-3.6 1.8z" fill="#4285f4"></path><path d="M51.1 18.2V1.1h2.3v17.1h-2.3z" fill="#34a853"></path><path d="M59.9 18.6c-2.2 0-3.8-.9-4.5-2.1l1.9-1.2c.5.9 1.4 1.5 2.6 1.5 1.5 0 2.4-.9 2.4-1.8 0-1.4-1.3-2-2.9-2h-1.5V11h1.4c1.3 0 2.5-.7 2.5-1.7 0-.9-.7-1.5-1.9-1.5-1.1 0-1.9.6-2.3 1.3l-1.9-1.1c.7-1.5 2.3-2.5 4.3-2.5 2.4 0 4.1 1.4 4.1 3.2 0 1.2-.7 2-1.7 2.4v.1c1.2.4 2 1.3 2 2.7 0 1.9-1.6 3.4-4.5 3.4z" fill="#ea4335"></path></svg>
    <h1>Bir hesap seçin</h1>
    <p>MyNotes uygulamasına devam etmek için</p>
    
    <div class="account-list" id="account-list">
      <!-- Accounts will be populated by JS -->
    </div>
  </div>

  <script>
    const accounts = [
      { name: 'Yusuf Said', email: 'ysaid4894@gmail.com', avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=ysaid4894' },
      { name: 'Ahmet Barıtçıoğlu', email: 'ahmet@baritcioglu.com', avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Ahmet' },
      { name: 'Yeni hesap ekle', email: '', avatar: 'https://cdn-icons-png.flaticon.com/512/1077/1077114.png', isNew: true }
    ];

    const list = document.getElementById('account-list');

    accounts.forEach(acc => {
      const item = document.createElement('div');
      item.className = 'account-item';
      
      const avatar = document.createElement('img');
      avatar.src = acc.avatar;
      avatar.className = 'avatar';
      
      const info = document.createElement('div');
      info.className = 'account-info';
      
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = acc.name;
      
      const email = document.createElement('div');
      email.className = 'email';
      email.textContent = acc.email;
      
      info.appendChild(name);
      if(acc.email) info.appendChild(email);
      
      item.appendChild(avatar);
      item.appendChild(info);

      item.onclick = () => {
        if (acc.isNew) {
          const customEmail = prompt("Google e-posta adresinizi girin:");
          if (customEmail) {
            window.opener.postMessage({
              type: 'GOOGLE_OAUTH_SUCCESS',
              user: {
                name: customEmail.split('@')[0],
                email: customEmail,
                avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(customEmail)}`
              }
            }, '*');
            window.close();
          }
        } else {
          window.opener.postMessage({
            type: 'GOOGLE_OAUTH_SUCCESS',
            user: {
              name: acc.name,
              email: acc.email,
              avatar: acc.avatar
            }
          }, '*');
          window.close();
        }
      };

      list.appendChild(item);
    });
  </script>
</body>
</html>
